esphome:
  name: quietcool-with-id-3speed

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

spi:
  clk_pin: 18
  mosi_pin: 23
  miso_pin: 19

external_components:
  - source:
      type: local
      path: ../../components
    components: [quiet_cool]

fan:
  - platform: quiet_cool
    id: quietcool_fan
    name: QuietCool Fan
    cs_pin: 5
    gdo0_pin: 13
    gdo2_pin: 27
    remote_id: [0x2D, 0xD4, 0x06, 0xCB, 0x00, 0xF7, 0xF2]
    speed_count: 3
