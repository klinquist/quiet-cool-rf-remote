esphome:
  name: quietcool-no-id-2speed

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

spi:
  clk_pin: 18
  mosi_pin: 23
  miso_pin: 19

external_components:
  - source:
      type: local
      path: ../../components
    components: [quiet_cool]

fan:
  - platform: quiet_cool
    id: quietcool_fan
    name: QuietCool Fan
    cs_pin: 5
    gdo0_pin: 13
    gdo2_pin: 27
    speed_count: 2
